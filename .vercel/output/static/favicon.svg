<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="moGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b694b" />
      <stop offset="100%" stop-color="#244530" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8bb796" />
      <stop offset="100%" stop-color="#d8ebd9" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#moGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#689a74" stroke-width="1.5" stroke-opacity="0.3" />

