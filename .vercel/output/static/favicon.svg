  <path d="M32 20 L32 46" stroke="#244530" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M32 30 C35 28, 39 29, 41 31" stroke="#244530" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M32 36 C29 34, 25 35, 23 37" stroke="#244530" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- MO Letters at the bottom -->
  <text x="32" y="58" font-family="'Fraunces', Georgia, serif" font-size="10" font-weight="700" fill="#f4faf5" text-anchor="middle" letter-spacing="1.5">MO</text>
